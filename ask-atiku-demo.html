<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ask Atiku</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --green:#0a5c38; --green-dark:#073d26; --gold:#d9a419; --gold-light:#f5d67b;
    --bg:#f2f5f3; --ink:#1c2b24; --muted:#6b7d74;
  }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); height:100dvh; display:flex; flex-direction:column; }
  header{ background:linear-gradient(135deg,var(--green-dark),var(--green)); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:12px; box-shadow:0 2px 10px rgba(0,0,0,.15); z-index:2; }
  .avatar{ width:46px; height:46px; border-radius:50%; background:var(--gold); color:var(--green-dark); font-weight:800; font-size:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:2px solid rgba(255,255,255,.5); }
  header h1{ font-size:18px; letter-spacing:.3px; }
  header p{ font-size:12px; opacity:.85; margin-top:2px; }
  #chat{ flex:1; overflow-y:auto; padding:14px 12px 8px; display:flex; flex-direction:column; gap:10px; }
  .msg{ max-width:85%; padding:10px 13px; border-radius:16px; font-size:14.5px; line-height:1.5; animation:pop .25s ease; }
  @keyframes pop{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
  .bot{ background:#fff; border:1px solid #e2e9e5; border-bottom-left-radius:4px; align-self:flex-start; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .user{ background:var(--green); color:#fff; border-bottom-right-radius:4px; align-self:flex-end; }
  .src{ display:block; margin-top:8px; font-size:11px; color:var(--muted); border-top:1px dashed #dfe6e2; padding-top:6px; }
  .user .src{ display:none; }
  .typing{ display:flex; gap:5px; padding:12px 15px; }
  .typing span{ width:7px; height:7px; border-radius:50%; background:#9db3a8; animation:blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s } .typing span:nth-child(3){ animation-delay:.4s }
  @keyframes blink{ 0%,60%,100%{opacity:.25} 30%{opacity:1} }
  #chips{ display:flex; gap:8px; overflow-x:auto; padding:8px 12px; background:var(--bg); scrollbar-width:none; }
  #chips::-webkit-scrollbar{ display:none; }
  .chip{ flex-shrink:0; font-size:13px; padding:8px 14px; border-radius:20px; border:1.5px solid var(--green); color:var(--green); background:#fff; cursor:pointer; font-weight:600; }
  .chip:active{ background:var(--green); color:#fff; }
  #bar{ display:flex; gap:8px; padding:10px 12px 12px; background:#fff; border-top:1px solid #e2e9e5; }
  #input{ flex:1; border:1.5px solid #d5ded9; border-radius:24px; padding:11px 16px; font-size:15px; outline:none; }
  #input:focus{ border-color:var(--green); }
  #send{ width:46px; height:46px; border-radius:50%; border:none; background:var(--green); color:#fff; font-size:19px; cursor:pointer; flex-shrink:0; }
  #send:active{ transform:scale(.93); }
  footer{ background:#fff; border-top:1px solid #eef1ef; padding:7px 12px; font-size:10.5px; color:var(--muted); text-align:center; line-height:1.5; }
</style>
</head>
<body>

<header>
  <div class="avatar">AA</div>
  <div>
    <h1>Ask Atiku</h1>
    <p>Straight answers from his published positions</p>
  </div>
  </header>

<div id="chat"></div>

<div id="chips">
  <button class="chip">What is his fuel price plan?</button>
  <button class="chip">How will he end insecurity?</button>
  <button class="chip">What about jobs?</button>
  <button class="chip">His education plan?</button>
  <button class="chip">What is restructuring?</button>
</div>

<div id="bar">
  <input id="input" type="text" placeholder="Ask about his policies…" autocomplete="off" enterkeyhint="send">
  <button id="send" aria-label="Send">➤</button>
</div>

<footer>
  Built by a supporter. Answers come only from Atiku Abubakar's public statements &amp; published plans.<br>
  Developed by Engr Mahmod
</footer>

<script>
/* ============================================================
   "Ask Atiku" knowledge engine — answers ONLY from the compiled
   knowledge base (workspace/atiku-campaign/knowledge-base.md).
   Nothing here is invented. Unknown topics get an honest fallback.
   ============================================================ */
const KB = [
{ k:["hello","hi","hey","good morning","good afternoon","good evening","salam"],
  a:"Hello! Ask me anything about Atiku Abubakar's policies — fuel prices, insecurity, jobs, education, restructuring — and I'll answer from his published positions.",
  s:"" },
{ k:["who are you","what can you do","help","what is this"],
  a:"I'm a demo assistant that answers questions using only Atiku Abubakar's published statements — his 2023 covenant 'My Covenant With Nigerians' and his 2027 Economic Recovery Plan. Try asking about fuel, insecurity, jobs or education.",
  s:"" },
{ k:["fuel","petrol","subsidy","pump price","dangote","refinery","nnpc"],
  a:"His 2027 plan replaces import subsidy with a <b>production subsidy</b>: qualifying Nigerian refineries get domestic crude at preferential prices, so pump prices fall. It has a fixed annual spending ceiling approved by the National Assembly, independent auditors tracking every barrel, and it phases out as refining capacity grows. His line: <i>\"Take the credit. I ask for only one thing: let Nigerians breathe.\"</i>",
  s:"Source: Atiku Economic Recovery Plan (AERP), launched August 2026" },
{ k:["security","insecurity","bandit","terror","kidnap","boko","police","army","military","ecomog","crime"],
  a:"He vows to <b>end insecurity within one year</b> of taking office: recruit more personnel and expand the police (he earlier proposed doubling it to about 700,000), modern equipment, better training and welfare, intelligence-led operations, and decentralised security. He'd also fund youths to start businesses — idleness fuels crime — and work with ECOWAS to revive ECOMOG for regional cooperation.",
  s:"Source: BBC Hausa interview, Aug 2026; ADC screening blueprint, May 2026" },
{ k:["job","employment","unemploy","work","poverty","poor","youth"],
  a:"His covenant promises <b>3 million new jobs</b> and lifting <b>10 million Nigerians out of poverty every year</b>, through a private-sector-led, market-driven economy — continuing what he describes as the 1999–2007 reform era. His 2027 plan adds a production-driven economy and a living wage.",
  s:"Source: 'My Covenant With Nigerians' (2023); AERP 2027" },
{ k:["education","school","teacher","university","student"],
  a:"<b>Free and compulsory primary and secondary education</b>, with greater emphasis on leadership, entrepreneurship, technology and innovation — so young Nigerians gain the skills to compete in a world driven by science and technology.",
  s:"Source: 'My Covenant With Nigerians' (2023); AERP 2027" },
{ k:["health","hospital","doctor","medical"],
  a:"Increased funding for <b>primary healthcare centres and specialist hospitals</b>, plus encouraging private investment in medical facilities — so fewer Nigerians need to travel abroad for treatment.",
  s:"Source: AERP 2027" },
{ k:["economy","naira","inflation","gdp","business","investor","market","tinubu"],
  a:"A <b>production-driven economy</b>: private-sector-led growth, a living wage, and a fixed annual spending ceiling in the federal budget with independent audits. His test for any reform: <i>\"Any economic reform that does not improve the lives of the people has failed.\"</i> On fuel hardship he notes — when petrol is expensive, transport is expensive; when transport is expensive, food is expensive.",
  s:"Source: AERP 2027; Sept 2026 press conference" },
{ k:["restructur","federalism","true federal","state police","resource control","devolution","local government","autonomy"],
  a:"<b>True federalism</b> is central for him: a strong federal government guaranteeing national unity, while states set their own priorities. He says a restructuring bill — covering <b>resource control, devolution of powers and state police</b> — is ready to go to the National Assembly on day one, plus <b>local government autonomy</b>.",
  s:"Source: 'My Covenant With Nigerians' (2023); Nov 2022 interview" },
{ k:["corruption","steal","loot","accountability","transparency","audit","trillion"],
  a:"<b>Zero-impunity governance</b>: independent audits, performance audits of public spending, and a public reconciliation of an estimated <b>₦30 trillion</b> in Federation Account entries linked to energy and past subsidy claims — plus prosecution of past subsidy fraud.",
  s:"Source: AERP 2027" },
{ k:["electricity","power","light","megawatt","energy"],
  a:"His covenant targets <b>25,000 megawatts</b> of electricity for Nigeria.",
  s:"Source: 'My Covenant With Nigerians' (2023)" },
{ k:["food","agriculture","farm","hunger"],
  a:"He treats <b>food security as a national security priority</b> — noting that expensive petrol makes transport expensive, which makes food expensive, and the Nigerian family receives the bill.",
  s:"Source: AERP 2027; Sept 2026 press conference" },
{ k:["who is atiku","about atiku","biography","waziri","adamawa","vice president","running mate","vice presidential"],
  a:"<b>Atiku Abubakar</b>, Wazirin Adamawa — Vice President of Nigeria (1999–2007), businessman, and now the <b>ADC presidential candidate for 2027</b> with Amaechi as running mate. He describes himself as an experienced, courageous, result-focused leader, and his slogan for the plan is <i>\"Get Nigeria working again.\"</i>",
  s:"Source: 'My Covenant With Nigerians' (2023); INEC Sept 2026 final list" },
{ k:["2027","election","adc","campaign","vote","primaries"],
  a:"He emerged as the <b>ADC's 2027 presidential candidate</b> from its 2026 primaries, running with <b>Amaechi</b> (confirmed on INEC's September 2026 final list). His platform: the Atiku Economic Recovery Plan — production subsidy, one-year security turnaround, free compulsory education, and restructuring.",
  s:"Source: AERP 2027; National Daily, Sept 2026" },
{ k:["quote","slogan","saying","famous"],
  a:"His signature lines: <i>\"Any economic reform that does not improve the lives of the people has failed.\"</i> — <i>\"Take the credit. I ask for only one thing: let Nigerians breathe.\"</i> — <i>\"Get Nigeria working again.\"</i>",
  s:"Source: AERP 2027; Sept 2026 press conference" },
{ k:["obasanjo","pdp","apc","obi","tinubu vs"],
  a:"I only answer from his published policy positions, not from political rivalries. Ask me about his plans — fuel, insecurity, jobs, education, restructuring.",
  s:"" },
];

const FALLBACK = "I don't have his published position on that — and I won't guess. His team publishes new positions regularly; ask me about fuel prices, insecurity, jobs, education, healthcare, restructuring or the economy.";

function norm(t){ return " "+t.toLowerCase().replace(/[^a-z0-9\s]/g," ")+" "; }
function findAnswer(q){
  const n = norm(q);
  let best=null, bestScore=0;
  for(const e of KB){
    let score=0;
    for(const k of e.k){ if(n.includes(" "+k+" ") || (k.length>4 && n.includes(k))) score += k.length; }
    if(score>bestScore){ bestScore=score; best=e; }
  }
  return bestScore>0 ? best : null;
}

const chat=document.getElementById('chat'), input=document.getElementById('input');
function bubble(html, who){
  const d=document.createElement('div');
  d.className='msg '+who; d.innerHTML=html;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
  return d;
}
function botSay(entry){
  const t=document.createElement('div');
  t.className='msg bot typing'; t.innerHTML='<span></span><span></span><span></span>';
  chat.appendChild(t); chat.scrollTop=chat.scrollHeight;
  setTimeout(()=>{
    t.classList.remove('typing');
    t.innerHTML = entry.a + (entry.s ? '<span class="src">'+entry.s+'</span>' : '');
    chat.scrollTop=chat.scrollHeight;
  }, 700+Math.random()*600);
}
function ask(q){
  q=q.trim(); if(!q) return;
  bubble(q.replace(/</g,"&lt;"), 'user');
  input.value='';
  const hit=findAnswer(q);
  botSay(hit || {a:FALLBACK, s:""});
}
document.getElementById('send').onclick=()=>ask(input.value);
input.addEventListener('keydown',e=>{ if(e.key==='Enter') ask(input.value); });
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>ask(c.textContent));

/* greeting */
setTimeout(()=>botSay({a:"Welcome! I'm <b>Ask Atiku</b> — ask me anything about his plans for Nigeria, and I'll answer strictly from his published statements. Try one of the topics below 👇", s:""}), 400);
</script>
</body>
</html>
