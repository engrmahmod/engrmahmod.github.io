<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎁 For You</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; }
  body { background:radial-gradient(ellipse at 50% 30%, #2b1055 0%, #12041f 70%, #0a0114 100%); color:#fff; }
  #stars { position:fixed; inset:0; z-index:1; }
  #stage { position:fixed; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  /* gift */
  #giftWrap { text-align:center; cursor:pointer; animation:float 2.5s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  #gift { font-size:110px; filter:drop-shadow(0 10px 30px rgba(255,100,200,.5)); transition:transform .2s; }
  #giftWrap:active #gift { transform:scale(.9); }
  #tapHint { margin-top:18px; font-size:18px; font-weight:700; color:#ffd76a; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  #forYou { font-size:15px; opacity:.7; margin-bottom:10px; letter-spacing:3px; }
  /* boom content */
  #boom { display:none; text-align:center; width:100%; max-width:420px; max-height:100%; overflow-y:auto; }
  #boom.show { display:block; }
  .big-title { font-size:0; margin:10px 0 4px; }
  .big-title span { display:inline-block; font-size:min(9vw,38px); font-weight:900; opacity:0;
    background:linear-gradient(180deg,#fff,#ffd76a 60%,#ff7b54); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:letterPop .5s cubic-bezier(.2,2.2,.4,1) forwards; filter:drop-shadow(0 3px 10px rgba(255,150,50,.45)); }
  @keyframes letterPop { from{opacity:0; transform:scale(.2) rotate(-20deg)} to{opacity:1; transform:scale(1) rotate(0)} }
  #subtitle { font-size:20px; font-weight:800; color:#ff9ecf; margin-bottom:14px; opacity:0; animation:fadeUp .8s .9s forwards; }
  @keyframes fadeUp { from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }
  #cake { font-size:64px; margin:6px 0; opacity:0; animation:fadeUp .8s 1.2s forwards; }
  .candle { display:inline-block; animation:flick 1s infinite alternate; transform-origin:50% 90%; }
  @keyframes flick { from{transform:rotate(-4deg) scale(1)} to{transform:rotate(4deg) scale(1.06)} }
  #msg { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:18px;
    padding:16px; font-size:15px; line-height:1.65; text-align:left; margin:12px 0; min-height:120px;
    backdrop-filter:blur(8px); opacity:0; }
  #msg.show { opacity:1; transition:opacity .6s; }
  #fromMe { font-size:15px; font-weight:600; color:#ff9ecf; margin:10px 0 20px; opacity:0; font-style:italic; }
  #fromMe.show { opacity:1; transition:opacity .8s; }
  .balloon { position:fixed; bottom:-120px; z-index:1; font-size:44px; animation:rise linear forwards; pointer-events:none; }
  @keyframes rise { to { transform:translateY(-110vh) rotate(12deg); } }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; z-index:5; pointer-events:none; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="flash"></div>
<div id="stage">
  <div id="giftWrap">
    <div id="forYou">SOMETHING FOR YOU</div>
    <div id="gift">🎁</div>
    <div id="tapHint">Tap to open 👆</div>
  </div>
  <div id="boom">
    <div class="big-title" id="title"></div>
    <div id="subtitle">HAPPY BIRTHDAY BESTIE! 🥳</div>
    <div id="cake"><span class="candle">🕯️</span>🎂<span class="candle">🕯️</span></div>
    <div id="msg"></div>
    <div id="fromMe">— with love, from Mahmod 💻</div>
  </div>
</div>
<script>
"use strict";
/* stars */
const sc = document.getElementById('stars'), sg = sc.getContext('2d');
let starArr = [];
function sizeStars(){ sc.width = innerWidth; sc.height = innerHeight;
  starArr = Array.from({length:120},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,
    r:Math.random()*1.6+.4,tw:Math.random()*Math.PI*2}));
}
sizeStars(); addEventListener('resize', sizeStars);
(function drawStars(){ sg.clearRect(0,0,sc.width,sc.height);
  starArr.forEach(s=>{ s.tw+=.03; sg.globalAlpha=.4+Math.abs(Math.sin(s.tw))*.6;
    sg.fillStyle='#fff'; sg.beginPath(); sg.arc(s.x,s.y,s.r,0,7); sg.fill(); });
  sg.globalAlpha=1; requestAnimationFrame(drawStars);
})();
/* confetti + fireworks on canvas overlay */
const fc = document.createElement('canvas');
fc.style.cssText='position:fixed;inset:0;z-index:4;pointer-events:none;';
document.body.appendChild(fc);
const fg = fc.getContext('2d');
function sizeFc(){ fc.width=innerWidth; fc.height=innerHeight; }
sizeFc(); addEventListener('resize', sizeFc);
let parts = [];
const COLORS=['#ff6ec4','#7873f5','#ffd76a','#4ade80','#38bdf8','#ff7b54','#f472b6'];
function boom(x,y,n,spread){
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=Math.random()*spread+2;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,g:.14,
      c:COLORS[Math.random()*COLORS.length|0],s:Math.random()*7+3,
      r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,life:90+Math.random()*60,shape:Math.random()<.4?'c':'r'});
  }
}
function fireworks(){ for(let k=0;k<5;k++) setTimeout(()=>{
  boom(Math.random()*fc.width, Math.random()*fc.height*.45, 60, 7); }, k*350); }
(function loop(){ fg.clearRect(0,0,fc.width,fc.height);
  parts = parts.filter(p=>p.life>0);
  parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=.985; p.r+=p.vr; p.life--;
    fg.save(); fg.translate(p.x,p.y); fg.rotate(p.r); fg.globalAlpha=Math.min(1,p.life/40);
    fg.fillStyle=p.c;
    if(p.shape==='c'){ fg.beginPath(); fg.arc(0,0,p.s/2,0,7); fg.fill(); }
    else fg.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);
    fg.restore(); });
  fg.globalAlpha=1; requestAnimationFrame(loop);
})();
function balloons(){ const em=['🎈','🎈','🎈','🎉','⭐','💖'];
  for(let i=0;i<14;i++) setTimeout(()=>{ const b=document.createElement('div');
    b.className='balloon'; b.textContent=em[Math.random()*em.length|0];
    b.style.left=Math.random()*90+'vw'; b.style.animationDuration=(5+Math.random()*4)+'s';
    document.body.appendChild(b); setTimeout(()=>b.remove(),9500); }, i*280);
}
/* typed message */
const MSG = "If my life was a program, you'd be the most important function in it \u2014 no bugs, no errors, just pure happiness every time you run. You debug my bad days and compile all my worries away without even trying.\n\nMay your new year be like clean code \u2014 smooth, beautiful, and full of amazing features. No deprecated dreams, only upgrades! \uD83D\uDE80\n\nKeep shining. The world is better with you in it \u2014 tested and confirmed \u2705";
function typeMsg(el, text, done){ el.classList.add('show'); let i=0;
  (function t(){ if(i<=text.length){ el.innerHTML=text.slice(0,i).replace(/\n/g,'<br>'); i+=2; setTimeout(t,18); }
    else if(done) done(); })();
}
/* main sequence */
const title = document.getElementById('title');
'HAPPY BIRTHDAY'.split('').forEach((ch,i)=>{ const s=document.createElement('span');
  s.textContent=ch===' '?'\u00A0':ch; s.style.animationDelay=(i*0.06)+'s'; title.appendChild(s); });
function celebrate(){
  document.getElementById('giftWrap').style.display='none';
  const boomEl=document.getElementById('boom'); boomEl.classList.add('show');
  const fl=document.getElementById('flash');
  fl.style.transition='none'; fl.style.opacity='.9';
  requestAnimationFrame(()=>{ fl.style.transition='opacity .6s'; fl.style.opacity='0'; });
  const r=fc.getBoundingClientRect();
  boom(r.width/2, r.height/2, 130, 11);
  setTimeout(fireworks, 500); setTimeout(balloons, 700);
  try{ navigator.vibrate && navigator.vibrate([80,40,80]); }catch(e){}
  setTimeout(()=>typeMsg(document.getElementById('msg'), MSG, ()=>{
    document.getElementById('fromMe').classList.add('show');
  }), 1600);
}
document.getElementById('giftWrap').onclick = celebrate;
</script>
</body>
</html>
