<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAT — Job Application Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>J</text></svg>">
<style>
:root{
  --bg:#070b16; --bg2:#080c17; --card:#0c1322; --card2:#0f1729;
  --border:#1c2742; --text:#e9edf5; --muted:#8b94a9;
  --blue:#2563eb; --blue-lt:#60a5fa;
  --green:#22c55e; --sky:#3b82f6; --orange:#f59e0b; --purple:#a855f7; --red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.5}
.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.sidebar{width:250px;background:var(--bg2);border-right:1px solid var(--border);padding:22px 14px;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:60;transition:transform .25s ease}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--blue);display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;flex:none}
.brand small{display:block;color:var(--muted);font-size:10.5px;font-weight:400}
.brand b{font-size:15px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--muted);font-size:13.5px;font-weight:500;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left}
.nav button .ic{font-size:16px;width:20px;text-align:center}
.nav button:hover{background:#101828;color:var(--text)}
.nav button.active{background:var(--blue);color:#fff}
.side-foot{margin-top:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;font-size:12px;color:var(--muted)}
.side-foot .ic{font-size:20px}
/* ---------- main / topbar ---------- */
.main{margin-left:250px;flex:1;min-width:0;padding:0 30px 60px}
.topbar{display:flex;align-items:center;gap:14px;padding:20px 0}
.menu-btn{display:none;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;font-size:16px;cursor:pointer}
.search{flex:1;max-width:380px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--muted)}
.search input{background:none;border:0;outline:0;color:var(--text);width:100%;font-size:13.5px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.bell{position:relative;background:var(--card);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-size:17px;cursor:pointer}
.bell .dot{position:absolute;top:8px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.user-chip{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.user-chip small{display:block;color:var(--muted);font-size:11px}
.user-chip b{font-size:13px}
.date-lbl{color:var(--muted);font-size:12.5px;white-space:nowrap}
/* ---------- generic ---------- */
h1{font-size:22px;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.page-head{display:flex;align-items:flex-start;gap:16px;margin:6px 0 20px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:#1d4ed8}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer}
.btn-ghost:hover{border-color:#2c3a5e}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.stat-ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:19px;margin-bottom:12px}
.stat-lbl{color:var(--muted);font-size:12.5px}
.stat-num{font-size:27px;font-weight:700;margin:2px 0}
.delta{font-size:12px;color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1.35fr;gap:16px;margin-bottom:16px}
.card h3{font-size:14.5px;font-weight:600;margin-bottom:14px}
.link{color:var(--blue-lt);font-size:12.5px;cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
/* pills */
.pill{display:inline-block;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;white-space:nowrap}
.pill.Applied{background:rgba(34,197,94,.14);color:#4ade80}
.pill.Interview{background:rgba(59,130,246,.16);color:#60a5fa}
.pill.Assessment{background:rgba(245,158,11,.14);color:#fbbf24}
.pill.Offer{background:rgba(168,85,247,.16);color:#c084fc}
.pill.Rejected{background:rgba(239,68,68,.14);color:#f87171}
/* tables / lists */
.rowline{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #141d33}
.rowline:last-child{border-bottom:0}
.cmp-logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;flex:none}
.rowline .grow{flex:1;min-width:0}
.rowline b{font-size:13.5px;display:block}
.rowline small{color:var(--muted);font-size:12px}
.ago{color:var(--muted);font-size:12px;white-space:nowrap}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tabs button{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer}
.tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}
/* applications table */
.tbl-tools{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.tbl-tools .search{max-width:300px}
select,input[type=text],input[type=date],input[type=email],input[type=url],textarea{background:#0a1120;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 13px;font-size:13.5px;font-family:inherit;width:100%;outline:0}
select:focus,input:focus,textarea:focus{border-color:var(--blue)}
table.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.tbl th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;padding:13px 16px;border-bottom:1px solid var(--border);background:#0a101f}
.tbl td{padding:13px 16px;border-bottom:1px solid #141d33;font-size:13.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#0e1628}
.tbl .cmp{display:flex;align-items:center;gap:12px}
/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px}
.field label .req{color:var(--red)}
.field .hint{font-size:11.5px;color:var(--muted);font-weight:400}
.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}
/* detail */
.back-link{color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:12px;display:inline-block}
.back-link:hover{color:var(--text)}
.detail-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.detail-head .grow{flex:1}
.detail-tabs{display:flex;gap:22px;border-bottom:1px solid var(--border);margin-bottom:18px}
.detail-tabs button{background:none;border:0;color:var(--muted);font-size:13.5px;font-weight:600;padding:10px 2px;cursor:pointer;border-bottom:2px solid transparent}
.detail-tabs button.active{color:var(--blue-lt);border-bottom-color:var(--blue)}
.kv{display:flex;gap:12px;padding:9px 0;font-size:13.5px;border-bottom:1px solid #141d33}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);width:130px;flex:none}
.kv .ic{width:20px;text-align:center}
/* calendar */
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cal-head h3{font-size:15px;margin:0}
.cal-nav{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;width:32px;height:32px;cursor:pointer}
.seg{display:flex;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);padding:9px 16px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button.active{background:var(--blue);color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{color:var(--muted);font-size:11.5px;font-weight:600;text-align:center;padding:6px 0}
.cal-day{background:var(--card);border:1px solid var(--border);border-radius:10px;min-height:92px;padding:8px;font-size:12px;cursor:pointer}
.cal-day.dim{opacity:.35}
.cal-day.today{border-color:var(--blue)}
.cal-day .dn{color:var(--muted);font-weight:600;margin-bottom:4px}
.ev{font-size:10.5px;font-weight:600;border-radius:6px;padding:3px 6px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
/* analytics */
.legend{display:flex;flex-direction:column;gap:9px;font-size:12.5px}
.legend .li{display:flex;align-items:center;gap:9px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .pc{margin-left:auto;color:var(--muted)}
/* profile */
.prof-head{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.avatar.lg{width:64px;height:64px;font-size:24px}
.switch{position:relative;width:44px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.sl{position:absolute;inset:0;background:#26314f;border-radius:20px;cursor:pointer;transition:.2s}
.sl:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.switch input:checked+.sl{background:var(--blue)}
.switch input:checked+.sl:before{transform:translateX(20px)}
.pref-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #141d33;font-size:13.5px}
.pref-row:last-child{border:0}
/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#12203a;border:1px solid var(--blue);color:#fff;padding:12px 22px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* responsive */
.scrim{display:none}
@media(max-width:920px){
  .sidebar{transform:translateX(-105%)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55}
  .main{margin-left:0;padding:0 16px 50px}
  .menu-btn{display:block}
  .cards4{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .date-lbl{display:none}
  .tbl-wrap{overflow-x:auto}
  table.tbl{min-width:640px}
  .cal-day{min-height:64px}
}
@media(max-width:560px){.cards4{grid-template-columns:1fr}.user-chip .who{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">J</div><div><b>JAT</b><small>Job Application Tracker</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div class="ic">🚀</div><div style="margin-top:8px;font-weight:600;color:var(--text)">Better applications.</div><div>Bigger opportunities.</div></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="search"><span>🔍</span><input id="topSearch" placeholder="Search jobs, companies, or positions..."></div>
      <div class="top-right">
        <span class="date-lbl" id="dateLbl"></span>
        <div class="bell" id="bellBtn">🔔<span class="dot" id="bellDot" style="display:none"></span></div>
        <div class="user-chip"><div class="avatar" id="topAvatar">M</div><div class="who"><b id="topName">Mahmod</b><small>Software Engineer</small></div></div>
      </div>
    </div>
    <div id="view"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ================= state ================= */
const LS_KEY = "jat_state_v1";
const STATUS_COLORS = {Applied:"#22c55e",Interview:"#3b82f6",Assessment:"#f59e0b",Offer:"#a855f7",Rejected:"#ef4444"};
const STATUS_ORDER = ["Applied","Interview","Assessment","Offer","Rejected"];

function seed(){
  return {
    seq: 7,
    route: {view:"dashboard"},
    appTab: "All", appQ: "", appSort: "recent",
    calY: 2026, calM: 9,
    detailTab: "overview",
    profile: {name:"Mahmod", full:"Mahmod Aminu", title:"Software Engineer",
      email:"mahmodaminu@gmail.com", phone:"+234 801 234 5678", location:"Nigeria", resume:""},
    prefs: {emailNotif:true, appReminders:true, interviewReminders:true, darkMode:true},
    apps: [
      {id:"a1",company:"Google",position:"Software Engineer",location:"Mountain View, CA, USA",jobType:"Full-time",
       salary:"$120,000 - $180,000 / year",link:"https://careers.google.com",applied:"2026-09-29",
       recruiter:"Sarah Johnson",recruiterMail:"sarah.johnson@google.com",status:"Interview",
       nextStep:"Technical Interview",nextDate:"2026-10-10",
       notes:"Good experience with the recruiter. Technical interview will be on Google Meet. Prepare for system design and coding questions.",
       noteUpdated:"Oct 5, 2026, 10:24 AM",source:"LinkedIn",color:"#4285F4",letter:"G"},
      {id:"a2",company:"Microsoft",position:"Software Engineer",location:"Remote",jobType:"Full-time",
       salary:"",link:"",applied:"2026-10-02",recruiter:"",recruiterMail:"",status:"Applied",
       nextStep:"",nextDate:"",notes:"",noteUpdated:"",source:"LinkedIn",color:"#00A4EF",letter:"M"},
      {id:"a3",company:"Amazon",position:"Backend Developer",location:"",jobType:"",
       salary:"",link:"",applied:"2026-10-03",recruiter:"",recruiterMail:"",status:"Assessment",
       nextStep:"Online Assessment",nextDate:"2026-10-08",notes:"",noteUpdated:"",source:"Company Website",color:"#FF9900",letter:"a"},
      {id:"a4",company:"Meta",position:"Software Engineer",location:"",jobType:"",
       salary:"",link:"",applied:"2026-09-25",recruiter:"",recruiterMail:"",status:"Offer",
       nextStep:"Offer Review",nextDate:"2026-10-05",notes:"",noteUpdated:"",source:"Referral",color:"#0668E1",letter:"∞"},
      {id:"a5",company:"Apple",position:"iOS Developer",location:"",jobType:"",
       salary:"",link:"",applied:"2026-09-28",recruiter:"",recruiterMail:"",status:"Applied",
       nextStep:"",nextDate:"",notes:"",noteUpdated:"",source:"Company Website",color:"#8E8E93",letter:""},
      {id:"a6",company:"Tesla",position:"Software Engineer",location:"",jobType:"",
       salary:"",link:"",applied:"2026-09-20",recruiter:"",recruiterMail:"",status:"Rejected",
       nextStep:"",nextDate:"",notes:"",noteUpdated:"",source:"Other",color:"#E31937",letter:"T"}
    ]
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(LS_KEY)) || seed(); }
catch(e){ S = seed(); }
if(!S.apps) S = seed();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON_S = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtD(iso){
  if(!iso) return "—";
  const [y,m,d] = iso.split("-").map(Number);
  return `${MON_S[m-1]} ${d}, ${y}`;
}
function relD(iso){
  if(!iso) return "";
  const days = Math.round((Date.now() - new Date(iso+"T12:00:00").getTime())/864e5);
  if(days<=0) return "today";
  if(days===1) return "1 day ago";
  if(days<7) return days+" days ago";
  if(days<14) return "1 week ago";
  return Math.round(days/7)+" weeks ago";
}
function pill(st){ return `<span class="pill ${esc(st)}">${esc(st)}</span>`; }
function logo(a, sz){
  const s = sz||38;
  return `<div class="cmp-logo" style="width:${s}px;height:${s}px;background:${esc(a.color||"#334155")};font-size:${Math.round(s*0.45)}px">${esc(a.letter||a.company[0]||"•")}</div>`;
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2200);
}
function donut(segs, size, thick, centerTop, centerSub){
  const R = 54, C = 2*Math.PI*R, total = segs.reduce((a,s)=>a+s.v,0)||1;
  let off = 25, circles = "";
  segs.forEach(s=>{
    const len = s.v/total*100;
    circles += `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${s.c}" stroke-width="${thick}" stroke-dasharray="${len} ${100-len}" stroke-dashoffset="${off}" stroke-linecap="butt" pathLength="100"/>`;
    off -= len;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" style="transform:rotate(0deg)">
    ${circles}
    <text x="60" y="58" text-anchor="middle" fill="#e9edf5" font-size="22" font-weight="700">${esc(centerTop)}</text>
    ${centerSub?`<text x="60" y="76" text-anchor="middle" fill="#8b94a9" font-size="11">${esc(centerSub)}</text>`:""}
  </svg>`;
}
function statusCounts(){
  const c = {}; STATUS_ORDER.forEach(s=>c[s]=0);
  S.apps.forEach(a=>{ c[a.status]=(c[a.status]||0)+1; });
  return c;
}
function go(view, param){
  S.route = {view, param: param||null};
  document.body.classList.remove("nav-open");
  render(); window.scrollTo(0,0);
}
/* ================= chrome ================= */
const NAV=[["dashboard","◧","Dashboard"],["applications","🗂","Applications"],["calendar","📅","Calendar"],["analytics","📈","Analytics"],["profile","👤","Profile"],["settings","⚙","Settings"]];
function greet(){const h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening";}
function upcoming(){
  const t=new Date(); t.setHours(0,0,0,0);
  return S.apps.filter(a=>{ if(!a.nextDate) return false;
    const dd=(new Date(a.nextDate+"T12:00:00")-t)/864e5; return dd>=0&&dd<=7; });
}
function render(){
  const v=S.route.view, key=(v==="settings")?"settings":v;
  $("#nav").innerHTML=NAV.map(n=>`<button data-v="${n[0]}" class="${key===n[0]?"active":""}"><span class="ic">${n[1]}</span>${n[2]}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{const vv=b.dataset.v;go(vv==="settings"?"profile":vv);});
  const d=new Date();
  $("#dateLbl").textContent=d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
  $("#topName").textContent=S.profile.name||"Mahmod";
  $("#topAvatar").textContent=((S.profile.name||"M")[0]||"M").toUpperCase();
  $("#bellDot").style.display=upcoming().length?"block":"none";
  const V={dashboard:vDashboard,applications:vApplications,detail:()=>vDetail(S.route.param),
           form:()=>vForm(S.route.param),calendar:vCalendar,analytics:vAnalytics,profile:vProfile,settings:vProfile};
  $("#view").innerHTML=(V[v]||vDashboard)();
  bindCommon();
  if(v==="dashboard") bindDashboard();
  else if(v==="applications") bindApplications();
  else if(v==="detail") bindDetail();
  else if(v==="form") bindForm();
  else if(v==="calendar") bindCalendar();
  else if(v==="analytics") bindAnalytics();
  else if(v==="profile"||v==="settings") bindProfile();
}
function bindCommon(){
  const mb=$("#menuBtn"); if(mb) mb.onclick=()=>document.body.classList.toggle("nav-open");
  const sc=$("#scrim"); if(sc) sc.onclick=()=>document.body.classList.remove("nav-open");
  const ts=$("#topSearch");
  if(ts) ts.onkeydown=e=>{ if(e.key==="Enter"){ S.appQ=ts.value; S.appTab="All"; go("applications"); } };
  const bell=$("#bellBtn");
  if(bell) bell.onclick=()=>{ const u=upcoming();
    toast(u.length?("Upcoming: "+u.map(a=>a.company+" ("+fmtD(a.nextDate)+")").join(", ")):"No upcoming interviews this week"); };
}
function thisWeek(list){ const t=Date.now(); return list.filter(a=>(t-new Date(a.applied+"T12:00:00").getTime())/864e5<=7); }

/* ================= dashboard ================= */
const STAT_META=[
  ["Total Applications","🗂","#2563eb"],
  ["Interviews","💼","#3b82f6"],
  ["Offers","🎁","#a855f7"],
  ["Rejected","✖","#ef4444"]
];
function vDashboard(){
  const c=statusCounts(), total=S.apps.length, wk=thisWeek(S.apps);
  const vals=[total,c.Interview||0,c.Offer||0,c.Rejected||0];

/* ================= applications ================= */
function appRows(){
  let list=[...S.apps];
  if(S.appTab!=="All") list=list.filter(a=>a.status===S.appTab);
  const q=S.appQ.trim().toLowerCase();
  if(q) list=list.filter(a=>(a.company+" "+a.position).toLowerCase().includes(q));
  if(S.appSort==="recent") list.sort((a,b)=>b.applied.localeCompare(a.applied));
  else if(S.appSort==="oldest") list.sort((a,b)=>a.applied.localeCompare(b.applied));
  else list.sort((a,b)=>a.company.localeCompare(b.company));
  return list;
}

/* ================= calendar ================= */
function vCalendar(){
  const y=S.calY,m=S.calM;
  const first=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate(), dimP=new Date(y,m,0).getDate();
  const evBy={};
  S.apps.forEach(a=>{ if(!a.nextDate) return;
    const [yy,mm,dd]=a.nextDate.split("-").map(Number);
    if(yy===y&&mm===m+1){ (evBy[dd]=evBy[dd]||[]).push(a); } });
  let cells="";
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>cells+=`<div class="cal-dow">${d}</div>`);
  for(let i=first-1;i>=0;i--) cells+=`<div class="cal-day dim"><div class="dn">${dimP-i}</div></div>`;
  const today=new Date();
  for(let d=1;d<=dim;d++){
    const evs=(evBy[d]||[]).map(a=>{
      const col=STATUS_COLORS[a.status]||"#60a5fa";
      return `<div class="ev" data-id="${a.id}" style="background:${col}22;color:${col};border:1px solid ${col}55">${esc(a.nextStep||a.status)} · ${esc(a.company)}</div>`;}).join("");
    const isT=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
    cells+=`<div class="cal-day${isT?" today":""}"><div class="dn">${d}</div>${evs}</div>`;
  }
  const tail=(first+dim)%7; if(tail) for(let d=1;d<=7-tail;d++) cells+=`<div class="cal-day dim"><div class="dn">${d}</div></div>`;
  return `
  <div class="page-head"><div style="flex:1"><h1>Calendar</h1>
    <div class="sub">Keep track of interviews, follow-ups and important dates.</div></div></div>
  <div class="card">
    <div class="cal-head">
      <button class="cal-nav" id="calPrev">‹</button><h3>${MONTHS[m]} ${y}</h3><button class="cal-nav" id="calNext">›</button>
      <div style="margin-left:auto" class="seg"><button class="active">Month</button><button id="segW">Week</button><button id="segD">Day</button></div>
    </div>
    <div class="cal-grid">${cells}</div>
  </div>`;
}
function bindCalendar(){
  const pv=$("#calPrev"),nx=$("#calNext");
  if(pv) pv.onclick=()=>{S.calM--;if(S.calM<0){S.calM=11;S.calY--;}save();render();};
  if(nx) nx.onclick=()=>{S.calM++;if(S.calM>11){S.calM=0;S.calY++;}save();render();};
  const sw=$("#segW"),sd=$("#segD");
  if(sw) sw.onclick=()=>toast("Week view coming soon");
  if(sd) sd.onclick=()=>toast("Day view coming soon");
  document.querySelectorAll(".ev").forEach(e=>e.onclick=ev=>{ev.stopPropagation();go("detail",e.target.dataset.id);});
}

/* ================= analytics ================= */
function vAnalytics(){
  const c=statusCounts(), total=S.apps.length||1;
  const ir=(c.Interview/total*100), or_=(c.Offer/total*100), sr=(c.Offer/total*100);
  const cards=[
    ["Total Applications",total,"↑ 33%"],["Interview Rate",ir.toFixed(1)+"%","↑ 12%"],
    ["Offer Rate",or_.toFixed(1)+"%","↑ 8%"],["Success Rate",sr.toFixed(1)+"%","↑ 10%"]
  ].map(k=>`<div class="card"><div class="stat-lbl">${k[0]}</div><div class="stat-num">${k[1]}</div><div class="delta">${k[2]}</div></div>`).join("");
  // line chart: cumulative apps over last 30 days
  const days=[]; const now=new Date(); now.setHours(0,0,0,0);
  for(let i=29;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);days.push(d);}
  const cum=days.map(d=>S.apps.filter(a=>new Date(a.applied+"T12:00:00")<=d).length);
  const mx=Math.max(...cum,1), W2=600,H2=220,pad2=30;
  const px=i=>pad2+i*(W2-2*pad2)/29, py=v=>H2-pad2-(v/mx)*(H2-2*pad2);
  const pts=cum.map((v,i)=>`${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
  const line=`<svg width="100%" viewBox="0 0 ${W2} ${H2}" preserveAspectRatio="none" style="height:220px">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".35"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${pad2},${H2-pad2} ${pts} ${W2-pad2},${H2-pad2}" fill="url(#ag)"/>
    <polyline points="${pts}" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
    ${cum.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v)}" r="3.5" fill="#0c1322" stroke="#60a5fa" stroke-width="2"/>`).join("")}
    <text x="${pad2}" y="${H2-8}" fill="#8b94a9" font-size="10">${MON_S[days[0].getMonth()]} ${days[0].getDate()}</text>
    <text x="${W2-pad2-46}" y="${H2-8}" fill="#8b94a9" font-size="10">${MON_S[days[29].getMonth()]} ${days[29].getDate()}</text>
  </svg>`;
  // source donut
  const src={}; S.apps.forEach(a=>{src[a.source||"Other"]=(src[a.source||"Other"]||0)+1;});
  const srcC={"LinkedIn":"#3b82f6","Company Website":"#22c55e","Referral":"#f59e0b","Other":"#a855f7"};
  const segs=Object.keys(src).map(k=>({v:src[k],c:srcC[k]||"#64748b",n:k}));
  const leg=segs.map(s=>`<div class="li"><span class="sw" style="background:${s.c}"></span>${esc(s.n)}<span class="pc">${s.v} (${(s.v/total*100).toFixed(1)}%)</span></div>`).join("");
  return `
  <div class="page-head"><div style="flex:1"><h1>Analytics</h1>
    <div class="sub">Track your progress and get insights.</div></div>
    <select style="width:auto"><option>Last 30 days</option><option>Last 90 days</option><option>All time</option></select></div>
  <div class="cards4">${cards}</div>
  <div class="grid2">
    <div class="card"><h3>Application Progress</h3>${line}</div>
    <div class="card"><h3>Applications by Source</h3>
      <div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap">
        ${donut(segs,150,15,S.apps.length,"")}
        <div class="legend" style="flex:1;min-width:150px">${leg||'<div class="sub">No data yet.</div>'}</div>
      </div></div>
  </div>`;
}

  const tg=(k,lbl)=>`<div class="pref-row"><span>${lbl}</span>
    <label class="switch"><input type="checkbox" data-pref="${k}" ${pr[k]?"checked":""}><span class="sl"></span></label></div>`;
  return `
  <div class="page-head"><div><h1>Profile & Settings</h1>
    <div class="sub">Manage your account and preferences.</div></div></div>
  <div class="grid2" style="grid-template-columns:1.4fr 1fr">
    <div class="card">
      <div class="prof-head"><div class="avatar lg">${esc((p.name||"M")[0].toUpperCase())}</div>
        <div class="grow" style="flex:1"><h1 style="font-size:18px">${esc(p.full||p.name)}</h1><div class="sub">${esc(p.title)}</div></div>
        <button class="btn-ghost" id="editProf">Edit Profile</button></div>
      <div id="profView">
        <h3>Personal Information</h3>
        <div class="kv"><span class="k">Email</span><span>${esc(p.email)}</span></div>
        <div class="kv"><span class="k">Phone</span><span>${esc(p.phone)}</span></div>
        <div class="kv"><span class="k">Location</span><span>${esc(p.location)}</span></div>
        <div class="kv"><span class="k">Resume</span><span>${p.resume?esc(p.resume):'<span style="color:var(--muted)">No resume uploaded</span>'} <span class="link" id="resumeBtn" style="margin-left:8px">View / Upload</span></span></div>
        <input type="file" id="resumeFile" style="display:none">
      </div>
      <div id="profEdit" style="display:none">
        <h3>Edit Profile</h3>
        <div class="form-grid">
          <div class="field"><label>Full Name</label><input type="text" id="p_full" value="${esc(p.full)}"></div>
          <div class="field"><label>Display Name</label><input type="text" id="p_name" value="${esc(p.name)}"></div>
          <div class="field"><label>Title</label><input type="text" id="p_title" value="${esc(p.title)}"></div>
          <div class="field"><label>Email</label><input type="email" id="p_email" value="${esc(p.email)}"></div>
          <div class="field"><label>Phone</label><input type="text" id="p_phone" value="${esc(p.phone)}"></div>
          <div class="field"><label>Location</label><input type="text" id="p_location" value="${esc(p.location)}"></div>
        </div>
        <div class="form-actions"><button class="btn" id="saveProf">Save</button></div>
      </div>
    </div>
    <div class="card"><h3>Preferences</h3>
      ${tg("emailNotif","Email notifications")}${tg("appReminders","Application reminders")}
      ${tg("interviewReminders","Interview reminders")}${tg("darkMode","Dark mode")}
    </div>
  </div>`;
}
function bindProfile(){
  document.querySelectorAll("[data-pref]").forEach(t=>t.onchange=()=>{
    S.prefs[t.dataset.pref]=t.checked; save(); toast("Preference saved"); });
  const ep=$("#editProf");
  if(ep) ep.onclick=()=>{ const v=$("#profView"),e=$("#profEdit");
    const open=e.style.display==="none"; e.style.display=open?"block":"none"; v.style.display=open?"none":"block";
    ep.textContent=open?"Cancel":"Edit Profile"; };
  const sp=$("#saveProf");
  if(sp) sp.onclick=()=>{ const g=x=>$("#"+x).value.trim();
    S.profile.full=g("p_full");S.profile.name=g("p_name");S.profile.title=g("p_title");
    S.profile.email=g("p_email");S.profile.phone=g("p_phone");S.profile.location=g("p_location");
    save(); toast("Profile saved"); render(); };
  const rb=$("#resumeBtn"),rf=$("#resumeFile");
  if(rb&&rf){ rb.onclick=()=>rf.click();
    rf.onchange=()=>{ if(rf.files[0]){ S.profile.resume=rf.files[0].name; save(); toast("Resume attached"); render(); } }; }
}

/* ================= init ================= */
render();
</script>
</body>
</html>
