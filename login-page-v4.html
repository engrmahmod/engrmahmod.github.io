<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(105deg, #6d28e8 0%, #8b3ff0 30%, #a855f7 52%, #c084fc 74%, #dcc2fb 100%);
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
    padding: 24px;
  }

  /* ---------- luminous rings behind the card ---------- */
  .rings {
    position: absolute;
    width: 135vmin;
    height: 135vmin;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* ---------- login card ---------- */
  .card {
    position: relative;
    z-index: 2;
    width: min(400px, 100%);
    background: linear-gradient(180deg, #ffffff 0%, #f4efff 100%);
    border-radius: 28px;
    padding: 40px 34px 32px;
    box-shadow:
      0 30px 80px rgba(60, 10, 120, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    animation: rise 0.55s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card h1 {
    font-size: 34px;
    font-weight: 800;
    color: #2d1b4e;
    letter-spacing: -0.01em;
    margin-bottom: 28px;
  }
  .flabel {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    color: #4a3a6b;
    margin: 0 0 8px 4px;
  }
  .field { position: relative; margin-bottom: 18px; }
  .field .licon {
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    stroke: #8b7bb5;
    fill: none; stroke-width: 1.8;
    pointer-events: none;
  }
  .field input {
    width: 100%;
    padding: 15px 46px 15px 44px;
    font-size: 14.5px;
    color: #2d1b4e;
    background: #ffffff;
    border: none;
    border-radius: 16px;
    outline: none;
    box-shadow: 0 4px 18px rgba(120, 80, 200, 0.12), inset 0 0 0 1px rgba(140, 110, 200, 0.14);
    transition: box-shadow 0.2s;
  }
  .field input::placeholder { color: #a493c9; }
  .field input:focus {
    box-shadow: 0 4px 18px rgba(120, 80, 200, 0.18), inset 0 0 0 2px #8b3ff0;
  }
  .field input#password.masked {
    -webkit-text-security: disc;
  }
  .field .eye {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    width: 22px; height: 22px;
    stroke: #4a3a6b;
    fill: none; stroke-width: 1.8;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    display: grid;
    place-items: center;
  }
  .btn {
    width: 100%;
    margin-top: 6px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    background: linear-gradient(135deg, #7c3aed 0%, #9333ea 60%, #a855f7 100%);
    box-shadow: 0 12px 30px rgba(124, 58, 237, 0.45);
    transition: transform 0.14s, box-shadow 0.2s, filter 0.2s;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 16px 38px rgba(124, 58, 237, 0.55); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.7; cursor: default; transform: none; }
  .card .foot {
    margin-top: 22px;
    text-align: center;
    font-size: 13.5px;
    color: #7a6a9e;
  }
  .card .foot a {
    color: #7c3aed;
    font-weight: 700;
    text-decoration: none;
  }
  .card .foot a:hover { text-decoration: underline; }
  .msg {
    display: none;
    margin-top: 14px;
    font-size: 13.5px;
    font-weight: 600;
    text-align: center;
    color: #6d28d9;
  }
  .msg.show { display: block; }
  .msg.err { color: #c2410c; }
</style>
</head>
<body>

  <!-- luminous 3D rings -->
  <svg class="rings" viewBox="0 0 1600 1600" aria-hidden="true">
    <defs>
      <linearGradient id="gPink" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f9a8d4"/>
        <stop offset="0.55" stop-color="#e879f9"/>
        <stop offset="1" stop-color="#c084fc"/>
      </linearGradient>
      <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#a78bfa"/>
        <stop offset="0.55" stop-color="#8b5cf6"/>
        <stop offset="1" stop-color="#7c3aed"/>
      </linearGradient>
      <linearGradient id="gLav" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e9d5ff"/>
        <stop offset="0.55" stop-color="#d8b4fe"/>
        <stop offset="1" stop-color="#f0abfc"/>
      </linearGradient>
      <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="34" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#glow)" fill="none">
      <ellipse cx="640" cy="820" rx="360" ry="470" stroke="url(#gPink)" stroke-width="110" opacity="0.9"/>
      <ellipse cx="960" cy="780" rx="330" ry="450" stroke="url(#gViolet)" stroke-width="100" opacity="0.9"/>
      <ellipse cx="800" cy="860" rx="420" ry="520" stroke="url(#gLav)" stroke-width="90" opacity="0.75"/>
    </g>
  </svg>

  <div class="card">
    <h1>Sign In</h1>
    <form id="loginForm" autocomplete="on">
      <label class="flabel" for="email">Email</label>
      <div class="field">
        <svg class="licon" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="14" rx="3"/>
          <path d="M3.5 7l8.5 6 8.5-6"/>
        </svg>
        <input id="email" name="email" type="email" placeholder="Enter your email" required />
      </div>

      <label class="flabel" for="password">Password</label>
      <div class="field">
        <svg class="licon" viewBox="0 0 24 24">
          <rect x="4.5" y="10" width="15" height="10" rx="3"/>
          <path d="M8 10V7.5a4 4 0 018 0V10"/>
          <circle cx="12" cy="15" r="1.4" fill="#8b7bb5" stroke="none"/>
        </svg>
        <input id="password" name="password" type="text" class="masked" placeholder="Enter your password" required />
        <button type="button" class="eye" id="togglePw" aria-label="Show password">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/>
            <circle cx="12" cy="12" r="2.6"/>
          </svg>
        </button>
      </div>

      <button class="btn" type="submit" id="signInBtn">Sign In</button>
      <div class="msg" id="formMsg"></div>
    </form>
    <p class="foot">No account yet? <a href="#">Register now</a></p>
  </div>

<script>
  // ---- password visibility toggle ----
  const pwInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePw');
  toggleBtn.addEventListener('click', () => {
    const hidden = pwInput.classList.toggle('masked');
    toggleBtn.setAttribute('aria-label', hidden ? 'Show password' : 'Hide password');
    toggleBtn.style.opacity = hidden ? '1' : '0.55';
  });

  // ---- sign-in integration point ----
  // Replace the body of handleSignIn with a real API call, e.g.:
  //   const res = await fetch('/api/login', {
  //     method: 'POST',
  //     headers: { 'Content-Type': 'application/json' },
  //     body: JSON.stringify({ email, password })
  //   });
  //   if (!res.ok) throw new Error('Invalid email or password');
  //   return await res.json();
  async function handleSignIn(email, password) {
    // DEMO: simulate a network round-trip. Swap in real auth here.
    await new Promise(r => setTimeout(r, 900));
    if (!email || !password) throw new Error('Please enter your email and password.');
    return { ok: true, email };
  }

  const form = document.getElementById('loginForm');
  const btn = document.getElementById('signInBtn');
  const msg = document.getElementById('formMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      const result = await handleSignIn(
        document.getElementById('email').value.trim(),
        pwInput.value
      );
      msg.textContent = '✓ Signed in as ' + result.email;
      msg.classList.add('show');
    } catch (err) {
      msg.textContent = err.message || 'Sign in failed. Please try again.';
      msg.classList.add('show', 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
