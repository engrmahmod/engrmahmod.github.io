<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAHMOD · Mastercard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100svh;background:#060606;color:#f5efe4;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(600px 400px at 20% 10%,rgba(200,160,60,.12),transparent 60%),radial-gradient(700px 500px at 85% 90%,rgba(140,40,60,.14),transparent 60%);pointer-events:none}
h1{font-family:'Cinzel',serif;font-size:15px;letter-spacing:6px;color:#c8a03c;margin-bottom:8px;font-weight:600}
.sub{color:#8a8073;font-size:13px;margin-bottom:38px;letter-spacing:1px}
.scene{perspective:1400px;width:min(420px,92vw)}
.card{position:relative;width:100%;aspect-ratio:1.586;transform-style:preserve-3d;transition:transform .25s ease;cursor:pointer}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.65),0 0 0 1px rgba(200,160,60,.25)}
.front{background:linear-gradient(135deg,#101010 0%,#1c1a17 30%,#0c0c0e 60%,#161310 100%)}
.front::before{content:'';position:absolute;inset:0;background:radial-gradient(400px 200px at 85% -10%,rgba(200,160,60,.22),transparent 60%),radial-gradient(300px 300px at -10% 110%,rgba(120,30,50,.25),transparent 60%)}
.front::after{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(115deg,transparent 0 14px,rgba(200,160,60,.045) 14px 15px);pointer-events:none}
.gold-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#c8a03c 20%,#f3d189 50%,#c8a03c 80%,transparent)}
.top-row{position:absolute;top:26px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:flex-start}
.bank{font-family:'Cinzel',serif;font-size:13px;letter-spacing:4px;color:#e8c876}
.debit{font-size:10px;letter-spacing:3px;color:#8a8073;border:1px solid rgba(200,160,60,.4);padding:5px 12px;border-radius:99px}
.chip{position:absolute;top:86px;left:30px;width:56px;height:42px;border-radius:8px;background:linear-gradient(135deg,#e8c876,#a87f2e 60%,#e8c876);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.chip::before{content:'';position:absolute;inset:6px;border:1px solid rgba(0,0,0,.4);border-radius:5px}
.chip::after{content:'';position:absolute;left:6px;right:6px;top:50%;height:1px;background:rgba(0,0,0,.4)}
.waves{position:absolute;top:96px;left:104px;color:#c8a03c;opacity:.85}
.number{position:absolute;top:152px;left:30px;right:30px;font-size:clamp(19px,5.4vw,25px);letter-spacing:3.5px;font-weight:500;color:#f5efe4;text-shadow:0 2px 8px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.meta{position:absolute;bottom:28px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:flex-end}
.meta small{display:block;font-size:9px;letter-spacing:2.5px;color:#8a8073;margin-bottom:6px}
.name{font-size:19px;letter-spacing:3px;font-weight:600;color:#f5efe4}
.exp{font-size:16px;letter-spacing:2px;color:#f5efe4;font-variant-numeric:tabular-nums}
.mc{position:absolute;bottom:24px;right:28px;width:64px;height:40px}
.mc circle{opacity:.92}
.back{background:linear-gradient(135deg,#141414,#0a0a0c);transform:rotateY(180deg)}
.mag{position:absolute;top:34px;left:0;right:0;height:56px;background:linear-gradient(180deg,#2a2a2e,#111)}
.sig{position:absolute;top:118px;left:30px;right:30px;height:48px;border-radius:8px;background:repeating-linear-gradient(115deg,#e9e2d2 0 8px,#ded5bf 8px 16px);display:flex;align-items:center;justify-content:flex-end;padding-right:14px}
.sig span{font-family:'Cinzel',serif;font-style:italic;font-size:20px;color:#333;letter-spacing:2px}
.cvv{position:absolute;top:118px;right:44px;background:#f5f5f5;color:#111;font-weight:700;font-size:15px;padding:13px 16px;border-radius:0 8px 8px 0;letter-spacing:2px}
.back small.note{position:absolute;bottom:30px;left:30px;right:30px;font-size:10px;line-height:1.7;color:#8a8073;letter-spacing:.5px}
.card.flipped{transform:rotateY(180deg)!important}
.hint{margin-top:30px;color:#8a8073;font-size:13px;letter-spacing:1px}
.hint b{color:#c8a03c}
@media(hover:hover){.card:hover{box-shadow:none}}
</style>
</head>
<body>
<h1>PREMIUM DEBIT</h1>
<p class="sub">Obsidian Gold Edition</p>
<div class="scene">
  <div class="card" id="card">
    <div class="face front">
      <div class="gold-line" style="top:0"></div>
      <div class="top-row"><span class="bank">MAHMOD BANK</span><span class="debit">DEBIT</span></div>
      <div class="chip"></div>
      <svg class="waves" width="34" height="26" viewBox="0 0 34 26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6c5 0 5 4 10 4s5-4 10-4"/><path d="M4 13c5 0 5 4 10 4s5-4 10-4"/><path d="M4 20c5 0 5 4 10 4s5-4 10-4"/></svg>
      <div class="number">5326&nbsp;&nbsp;7890&nbsp;&nbsp;1234&nbsp;&nbsp;5678</div>
      <div class="meta">
        <div><small>CARD HOLDER</small><div class="name">MAHMOD</div></div>
        <div><small>EXPIRES</small><div class="exp">12/30</div></div>
      </div>
      <svg class="mc" viewBox="0 0 64 40"><circle cx="25" cy="20" r="15" fill="#eb001b"/><circle cx="39" cy="20" r="15" fill="#f79e1b" fill-opacity=".85"/></svg>
      <div class="gold-line" style="bottom:0"></div>
    </div>
    <div class="face back">
      <div class="mag"></div>
      <div class="sig"><span>Mahmod</span></div><div class="cvv">123</div>
      <small class="note">This is a design concept card. Not a real payment card. If found, please return to Mahmod Bank.</small>
    </div>
  </div>
</div>
<p class="hint">Tap the card to <b>flip</b> it · move to <b>tilt</b></p>
<script>
var card=document.getElementById('card'),flipped=false;
card.addEventListener('click',function(){flipped=!flipped;card.classList.toggle('flipped',flipped);});
document.addEventListener('pointermove',function(e){
  if(flipped)return;
  var r=card.getBoundingClientRect();
  var x=(e.clientX-(r.left+r.width/2))/r.width, y=(e.clientY-(r.top+r.height/2))/r.height;
  if(Math.abs(x)>1.2||Math.abs(y)>1.2){card.style.transform='';return;}
  card.style.transform='rotateY('+(x*16)+'deg) rotateX('+(-y*14)+'deg)';
});
document.addEventListener('pointerleave',function(){if(!flipped)card.style.transform='';});
</script>
</body>
</html>
