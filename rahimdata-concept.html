<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RahimData — Data, Airtime & Bills</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#070b09;--bg2:#0b100d;--card:#101613;--line:rgba(255,255,255,.09);--g:#12b76a;--gd:#0a8a4e;--gold:#f5c044;--txt:#f2f7f4;--dim:#93a89a;--red:#e05252;--r:20px}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100svh}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}
.btn{display:inline-block;background:var(--g);color:#04120a;font-weight:800;border:none;border-radius:14px;padding:14px 26px;font-size:15px;cursor:pointer;box-shadow:0 8px 24px rgba(18,183,106,.3);transition:.2s;white-space:nowrap;text-align:center}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--txt);border:1.5px solid var(--line);box-shadow:none}
.btn.sm{padding:9px 18px;font-size:13px;border-radius:11px}
.btn.block{width:100%;margin-top:14px}
label{display:block;font-size:11px;letter-spacing:1.2px;color:var(--dim);margin:14px 0 7px;font-weight:800}
input,select,textarea{width:100%;background:#0d1310;border:1.5px solid var(--line);border-radius:13px;color:var(--txt);padding:13px 14px;font-size:15px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--g)}
select option{background:#0d1310}
nav.top{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(14px);background:rgba(7,11,9,.75);border-bottom:1px solid var(--line)}
.nav-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;white-space:nowrap;flex-shrink:0}
.logo .mk{width:32px;height:32px;flex-shrink:0;border-radius:10px;background:linear-gradient(135deg,var(--g),var(--gd));display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 16px rgba(18,183,106,.4)}
.logo small{display:block;font-size:8px;color:var(--dim);letter-spacing:2px;font-weight:700}
.links{display:flex;gap:20px;font-size:14px;color:var(--dim);font-weight:600}
.links a:hover{color:var(--txt)}
.nav-cta{display:flex;gap:8px;margin-left:auto;flex-shrink:0}
.hero{position:relative;padding:148px 0 66px;overflow:hidden}
.hero::before{content:"";position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:500px;background:radial-gradient(ellipse,rgba(18,183,106,.22),transparent 65%);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(18,183,106,.12);border:1px solid rgba(18,183,106,.3);color:var(--g);font-size:12px;font-weight:800;letter-spacing:1.5px;padding:8px 16px;border-radius:99px;margin-bottom:20px}
.hero h1{font-size:clamp(34px,5.4vw,58px);line-height:1.08;letter-spacing:-1px}
.hero h1 em{font-style:normal;background:linear-gradient(120deg,var(--g),#7bf0b2);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{color:var(--dim);font-size:17px;margin:18px 0 28px;max-width:480px;line-height:1.6}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;gap:18px;margin-top:26px;flex-wrap:wrap;font-size:13px;color:var(--dim);font-weight:600}
.trust span{display:flex;align-items:center;gap:7px}
.phone{width:280px;margin:0 auto;background:#0d1310;border:1px solid var(--line);border-radius:38px;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(18,183,106,.12)}
.screen{background:var(--bg2);border-radius:26px;overflow:hidden;padding:18px 14px}
.scr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.scr-top b{font-size:13px}.pill{font-size:10px;font-weight:800;background:rgba(18,183,106,.15);color:var(--g);padding:5px 10px;border-radius:99px}
.bal{background:linear-gradient(135deg,#0d3b24,#12b76a);border-radius:16px;padding:16px;color:#fff;margin-bottom:12px}
.bal small{opacity:.75;font-size:10px;letter-spacing:1px}.bal b{font-size:24px;display:block;margin-top:2px}
.qk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qk div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:9px;color:var(--dim);font-weight:700}
.qk div i{font-style:normal;font-size:18px;display:block;margin-bottom:3px}
.order{background:var(--card);border:1px solid rgba(18,183,106,.35);border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.order small{color:var(--dim);font-size:10px;display:block}.order b{font-size:13px}
.order .ok{background:var(--g);color:#04120a;font-size:10px;font-weight:800;padding:7px 12px;border-radius:99px}
.mq{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;overflow:hidden;white-space:nowrap}
.mq span{font-size:15px;font-weight:800;letter-spacing:3px;color:var(--dim);margin:0 28px}
.mq span b{color:var(--g)}
section{padding:70px 0}
.kicker{color:var(--g);font-size:12px;font-weight:800;letter-spacing:2.5px;margin-bottom:12px}
h2.sec{font-size:clamp(26px,3.6vw,40px);letter-spacing:-.5px;margin-bottom:12px}
p.lead{color:var(--dim);font-size:16px;max-width:560px;line-height:1.65;margin-bottom:34px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;transition:.25s;cursor:pointer}
.svc:hover{transform:translateY(-5px);border-color:rgba(18,183,106,.4)}
.svc .ic{width:52px;height:52px;border-radius:15px;background:rgba(18,183,106,.12);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px}
.svc h3{font-size:17px;margin-bottom:8px}.svc p{font-size:14px;color:var(--dim);line-height:1.6}
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.ptabs button{border:1px solid var(--line);background:var(--card);color:var(--dim);font-weight:800;font-size:14px;padding:11px 22px;border-radius:99px;cursor:pointer}
.ptabs button.on{background:var(--g);border-color:var(--g);color:#04120a}
.ptable{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);font-size:14px}
.prow:last-child{border:none}
.prow.head{background:rgba(18,183,106,.07);font-size:11px;letter-spacing:1.5px;color:var(--dim);font-weight:800}
.prow .pr{color:var(--gold);font-weight:800;font-size:16px}
.prow .tag{font-size:11px;background:rgba(255,255,255,.07);padding:5px 11px;border-radius:99px;color:var(--dim);font-weight:700}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.why{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;text-align:center}
.why .n{font-size:30px;margin-bottom:10px}.why h3{font-size:15px;margin-bottom:8px}.why p{font-size:13px;color:var(--dim);line-height:1.6}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:st}
.step{background:linear-gradient(180deg,var(--card),transparent);border:1px solid var(--line);border-radius:var(--r);padding:28px;position:relative}
.step::before{counter-increment:st;content:"0" counter(st);position:absolute;top:20px;right:24px;font-size:40px;font-weight:800;color:rgba(18,183,106,.18)}
.step h3{font-size:17px;margin-bottom:8px}.step p{font-size:14px;color:var(--dim);line-height:1.6}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tst{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.tst .stars{color:var(--gold);letter-spacing:2px;margin-bottom:12px;font-size:14px}
.tst p{font-size:14px;line-height:1.65;color:#d7e2da;margin-bottom:16px}
.tst b{font-size:14px}.tst small{color:var(--dim);display:block;font-size:12px}
.faq{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;background:var(--card)}
.faq>button{width:100%;background:none;border:none;color:var(--txt);text-align:left;padding:18px 20px;font-size:15px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.faq .a{max-height:0;overflow:hidden;transition:max-height .3s;color:var(--dim);font-size:14px;line-height:1.65}
.faq .a div{padding:0 20px 18px}
.faq.open .a{max-height:220px}
.cta{background:linear-gradient(135deg,#0b3a22,#12b76a 140%);border-radius:28px;padding:56px 32px;text-align:center}
.cta h2{font-size:clamp(26px,4vw,42px);letter-spacing:-.5px;margin-bottom:12px}
.cta p{opacity:.85;margin-bottom:26px;font-size:16px}
.cta .btn{background:#fff;color:#04120a}
footer.site{border-top:1px solid var(--line);padding:40px 0;color:var(--dim);font-size:14px}
.fgrid{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.appnav{position:sticky;top:0;z-index:40;background:rgba(7,11,9,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.appnav .logo{font-size:16px}
.appnav .wchip{margin-left:auto;background:rgba(18,183,106,.12);border:1px solid rgba(18,183,106,.3);color:var(--g);font-weight:800;font-size:13px;padding:8px 14px;border-radius:99px;white-space:nowrap;cursor:pointer}
main.app{max-width:620px;margin:0 auto;padding:18px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:10px}
.wal-hero{background:linear-gradient(135deg,#0d3b24,#12b76a);border-radius:22px;padding:22px;color:#fff;margin-bottom:14px}
.wal-hero small{opacity:.75;font-size:11px;letter-spacing:1.5px;font-weight:700}
.wal-hero .amt{font-size:36px;font-weight:800;margin:4px 0 12px}
.wal-hero .row{display:flex;gap:10px}
.wal-hero .btn{background:#fff;color:#04120a;box-shadow:none;padding:11px 20px;font-size:13px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.qa{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 6px;text-align:center;cursor:pointer}
.qa i{font-style:normal;font-size:24px;display:block;margin-bottom:6px}
.qa small{font-size:10px;color:var(--dim);font-weight:800}
.planrow{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.planrow:last-child{border:none}
.planrow .inf b{font-size:15px;display:block}.planrow .inf small{color:var(--dim);font-size:12px}
.planrow .pr{text-align:right}.planrow .pr b{color:var(--gold);font-size:16px;display:block}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:none}.kv span{color:var(--dim)}.kv b{font-weight:700}
.txn{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.txn:last-child{border:none}
.txn .t-ic{width:40px;height:40px;border-radius:12px;background:rgba(18,183,106,.12);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.txn .t-amt{font-weight:800;white-space:nowrap}
.txn .t-amt.out{color:var(--red)}.txn .t-amt.in{color:var(--g)}
.txn small{color:var(--dim);font-size:11px;display:block;margin-top:2px}
.st-ok{font-size:10px;font-weight:800;color:var(--g);background:rgba(18,183,106,.12);padding:4px 10px;border-radius:99px;white-space:nowrap}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(10,15,12,.96);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}
nav.bottom button{flex:1;background:none;border:none;color:var(--dim);font-size:10px;font-weight:800;padding:6px;cursor:pointer}
nav.bottom button.on{color:var(--g)}
nav.bottom .ic{font-size:22px;display:block;margin-bottom:2px}
.authbox{max-width:420px;margin:0 auto;padding:80px 22px 40px}
.authbox .logo{justify-content:center;margin-bottom:24px;font-size:22px}
.authcard{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px}
.authcard h2{font-size:22px;margin-bottom:6px}.authcard p{color:var(--dim);font-size:14px;margin-bottom:8px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:#0e1411;border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:620px;max-height:88svh;overflow-y:auto;padding:24px 20px calc(28px + env(safe-area-inset-bottom))}
.panel h2{font-size:19px;margin-bottom:4px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#0e1411;border:1px solid rgba(18,183,106,.4);color:#fff;padding:13px 24px;border-radius:99px;font-size:14px;font-weight:700;z-index:99;max-width:90vw;text-align:center}
.secttl{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--dim);margin:20px 0 10px}
.netgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
.net{border:1.5px solid var(--line);border-radius:16px;padding:16px 6px;text-align:center;cursor:pointer;background:var(--card)}
.net b{font-size:13px;display:block;margin-top:6px}
.net .dot{width:34px;height:34px;border-radius:50%;margin:0 auto;font-size:15px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center}
.net.sel{border-color:var(--g);background:rgba(18,183,106,.08)}
.codebox{background:#0a0f0c;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:monospace;font-size:12px;overflow-x:auto;color:#9fe8bd;margin:10px 0;white-space:pre}
.empty{text-align:center;color:var(--dim);padding:36px 16px;font-size:14px}
.reveal{opacity:0;transform:translateY(26px);transition:.7s}
.reveal.in{opacity:1;transform:none}
.backlink{display:inline-block;color:var(--g);font-weight:800;font-size:14px;margin-bottom:12px;cursor:pointer}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr}.sgrid,.wgrid,.tgrid,.steps{grid-template-columns:1fr 1fr}.links{display:none}.prow{grid-template-columns:1fr auto auto}.prow .tag{display:none}}
@media(max-width:560px){.sgrid,.wgrid,.tgrid,.steps{grid-template-columns:1fr}}
@media(max-width:480px){
 .nav-in{padding:10px 12px;gap:10px}
 .logo{font-size:15px;gap:8px}
 .logo .mk{width:30px;height:30px;font-size:15px}
 .logo small{display:none}
 .nav-cta{gap:6px}
 .nav-cta .btn.sm{padding:8px 13px;font-size:12px;border-radius:10px}
 .hero{padding:112px 0 52px}
 section{padding:52px 0}
 .hero h1{font-size:32px}
 .cta-row .btn{padding:13px 20px;font-size:14px}
}
</style>
</head>

<div id="root"></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div>
<nav class="bottom hidden" id="bnav"></nav>
<script>
/* ================= DATA (from live site) ================= */
const N="₦";
const NETS={
 mtn:{name:"MTN",c:"#ffcc08",plans:[["500MB","SME","7 days",295],["1GB","Gifting","7 days",440],["1GB","SME","7 days",450],["1GB","Corporate Gifting","7 days",500],["1GB","SME","30 days",550],["2GB","SME","7 days",850],["3GB","SME","30 days",1350],["5GB","SME","30 days",2000],["10GB","SME","30 days",4800]]},
 airtel:{name:"Airtel",c:"#e40000",plans:[["1GB","Gifting","3 days (Social)",295],["1GB","SME","3 days (Social)",350],["500MB","SME","7 days",495],["1GB","SME","7 days",790],["1GB","Corporate Gifting","7 days",795],["2GB","SME","30 days",1500],["10GB","SME","30 days",3600]]},
 glo:{name:"Glo",c:"#35b558",plans:[["500MB","Corporate Gifting","30 days",250],["1GB","Gifting","1 day",250],["1GB","Corporate Gifting","3 days",360],["1GB","Corporate Gifting","7 days",375],["1GB","Corporate Gifting","30 days",450],["2GB","Corporate Gifting","30 days",895],["10GB","Corporate Gifting","30 days",4400]]},
 etisalat:{name:"9mobile",c:"#0a8a4e",plans:[["500MB","Corporate Gifting","7 days",280],["1GB","Corporate Gifting","30 days",550],["2GB","Corporate Gifting","7 days",1020],["5GB","Corporate Gifting","30 days",2550],["10GB","Corporate Gifting","30 days",5050]]}};
const CABLE={dstv:{name:"DStv",plans:[["Padi",2500],["Yanga",4200],["Confam",7200],["Compact",12500],["Premium",21000]]},
 gotv:{name:"GOtv",plans:[["Lite",1900],["Value",3800],["Plus",5800],["Max",7200]]},
 startimes:{name:"StarTimes",plans:[["Basic",2500],["Smart",3800],["Classic",4500],["Super",7500]]}};
const DISCOS=["Ikeja","Eko","Abuja","Kano","Enugu","Port Harcourt","Ibadan","Kaduna","Jos","Benin","Yola"];
const EXAMS=[["WAEC Result Checker",5250],["NECO Result Checker",2100],["NABTEB Result Checker",2500]];
const naira=n=>N+Number(n||0).toLocaleString();
let V="landing";
let DB=load()||{user:null,wallet:0,txns:[]};
function load(){try{return JSON.parse(localStorage.getItem("rahimdemo"))}catch(e){return null}}
function save(){localStorage.setItem("rahimdemo",JSON.stringify(DB))}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
function panel(h){document.getElementById("panel").innerHTML=h;document.getElementById("sheet").classList.add("open")}
function closeSheet(){document.getElementById("sheet").classList.remove("open")}
function tx(type,desc,amount,st){DB.txns.unshift({id:"TX"+Date.now().toString().slice(-6),type,desc,amount:amount,date:new Date().toLocaleString(),st:st||"Successful"});save()}
function debit(amount,desc,type){if(DB.wallet<amount){toast("Insufficient balance. Please fund your wallet.");return false}DB.wallet-=amount;tx(type||"Purchase",desc,-amount);save();return true}
function credit(amount,desc){DB.wallet+=amount;tx("Funding",desc,amount);save()}
function successSheet(title,lines){panel(`<div style="text-align:center;padding:10px 0"><div style="font-size:56px">✅</div><h2 style="margin:10px 0">${title}</h2>${lines.map(l=>`<div class="kv"><span>${l[0]}</span><b>${l[1]}</b></div>`).join("")}<button class="btn block" onclick="closeSheet();go('dash')">Done</button></div>`)}
</script>

<script>
/* ================= ROUTER ================= */
const AUTHD=["dash","services","data","airtime","cable","power","sms","a2c","print","exams","fund","history","referrals","api","settings"];
const BNAV=[["dash","🏠","Home"],["services","🛒","Services"],["fund","💳","Fund"],["history","🧾","History"],["more","⋯","More"]];
function go(v){
 if(AUTHD.includes(v)&&!DB.user)v="login";
 V=v;render();window.scrollTo(0,0);
}
function render(){
 const r=document.getElementById("root"),bn=document.getElementById("bnav");
 const inApp=AUTHD.includes(V);
 bn.classList.toggle("hidden",!inApp);
 if(inApp)bn.innerHTML=BNAV.map(([k,ic,l])=>`<button class="${V===k||(V==='more'&&k==='more')?"on":""}" onclick="go('${k}')"><span class="ic">${ic}</span>${l}</button>`).join("");
 ({landing:vLanding,login:vLogin,signup:vSignup,dash:vDash,services:vServices,data:vData,airtime:vAirtime,cable:vCable,power:vPower,sms:vSms,a2c:vA2c,print:vPrint,exams:vExams,fund:vFund,history:vHistory,referrals:vReferrals,api:vApi,settings:vSettings,more:vMore}[V]||vLanding)(r);
 if(V==="landing")initReveal();
}
function appHead(title){
 return `<div class="appnav"><a class="logo" onclick="go('dash')" style="cursor:pointer"><span class="mk">⚡</span>RahimData</a><span class="wchip" onclick="go('fund')">${naira(DB.wallet)}</span></div><main class="app">${title?`<span class="backlink" onclick="go('dash')">← Dashboard</span>`:""}`;
}
function appFoot(){return `</main>`}
/* ================= LANDING ================= */
function vLanding(r){
 r.innerHTML=`

function prCalc(){const q=+document.getElementById("pr_q").value||0,d=+document.getElementById("pr_d").value;document.getElementById("pr_t").textContent=naira(q*d)}
function doPrint(){
 const q=+document.getElementById("pr_q").value||0,d=+document.getElementById("pr_d").value,cost=q*d;
 if(q<1){toast("Enter quantity");return}
 if(!debit(cost,`Recharge pins ${naira(d)} × ${q}`,"Purchase"))return;
 const pins=Array.from({length:Math.min(q,5)},()=>Math.floor(100000000000+Math.random()*899999999999));
 panel(`<h2>Pins generated 🎫</h2><p style="color:var(--dim);font-size:13px">${naira(d)} × ${q} pins</p><div class="codebox">${pins.join("\n")}${q>5?"\n…+"+(q-5)+" more":""}</div><button class="btn block" onclick="closeSheet();go('dash')">Done</button>`);
}
